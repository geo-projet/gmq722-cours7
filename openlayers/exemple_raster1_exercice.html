<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Exercice – 2 couches WMS</title>
    <!-- API OpenLayers 10.11.0 : le style CSS et le code JavaScript (version complète « ol.js ») -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@v10.11.0/ol.css">
    <script src="https://cdn.jsdelivr.net/npm/ol@v10.11.0/dist/ol.js"></script>
    <style>
      html, body { height: 100%; margin: 0; font-family: system-ui, sans-serif; }
      h2 { margin: 8px 12px; }
      .map { height: calc(100% - 48px); width: 100%; }
    </style>
  </head>
  <body>
    <h2>Exercice : routes + hydrographie (WMS)</h2>
    <div id="map" class="map"></div>
    <script>
      const view = new ol.View({
        center: ol.proj.fromLonLat([-73.56, 45.50]),
        zoom: 10
      });
      const osmLayer = new ol.layer.Tile({
        source: new ol.source.OSM()
      });
      // Couche WMS (tuilée) de RNCan : réseau routier
      const layer1 = new ol.layer.Tile({
        source: new ol.source.TileWMS({
          url: 'https://cartes.geogratis.gc.ca/wms/roads_fr',
          params: { LAYERS: 'routes', VERSION: '1.3.0' }
        })
      });
      const layer2 = new ol.layer.Tile({
        source: new ol.source.TileWMS({
          url: 'https://cartes.geogratis.gc.ca/wms/hydro_network_fr',
          params: { LAYERS: 'nhn:nhn', VERSION: '1.3.0' }
        })
      });

      const map = new ol.Map({ target: 'map' });
      map.addLayer(osmLayer);
      map.addLayer(layer1);
      map.addLayer(layer2);
      map.setView(view);
    </script>
  </body>
</html>
