<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Leaflet – carte de base + WMS</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style> html, body, #map { height: 100%; margin: 0; } </style>
  </head>
  <body>
    <div id="map"></div>
    <script>
      // Leaflet : latitude AVANT longitude
      const map = L.map('map').setView([45.50, -73.56], 10);

      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '© contributeurs OpenStreetMap'
      }).addTo(map);

      L.tileLayer.wms('https://cartes.geogratis.gc.ca/wms/roads_fr', {
        layers: 'routes', format: 'image/png', transparent: true
      }).addTo(map);

      L.control.scale({ imperial: false }).addTo(map);
    </script>
  </body>
</html>
