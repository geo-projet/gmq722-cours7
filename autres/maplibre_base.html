<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MapLibre GL JS – tuiles vectorielles</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.css">
    <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
    <style> html, body, #map { height: 100%; margin: 0; } </style>
  </head>
  <body>
    <div id="map"></div>
    <script>
      // MapLibre : tuiles VECTORIELLES stylées dans le navigateur (style JSON)
      const map = new maplibregl.Map({
        container: 'map',
        style: 'https://tiles.openfreemap.org/styles/liberty',   // OpenFreeMap : sans clé
        center: [-73.56, 45.50],                                 // [lon, lat]
        zoom: 11
      });
      map.addControl(new maplibregl.NavigationControl());
      map.addControl(new maplibregl.ScaleControl({ unit: 'metric' }));
    </script>
  </body>
</html>
